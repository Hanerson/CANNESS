- insert:
    - id: canness
      name: dsh-canness
    - id: canness-knowledge
      name: dsh-canness/knowledge
      config:
        kbRoot: ./plugin/knowledge_base
    - id: canness-generator
      name: dsh-canness/generator
    - id: canness-eval
      name: dsh-canness/eval
      config:
        host: ""
        port: 22
        username: ""
        privateKeyPath: ""
        inbox: /tmp/canness-a/inbox
        outbox: /tmp/canness-a/outbox
        timeoutSec: 1800
        pollIntervalMs: 2000
        setEnv: ""
        maxIterations: 10
        maxCompileRetries: 3
        negativeStreakLimit: 3
        convergenceThreshold: 0.05
    - id: canness-loop
      name: dsh-canness/loop
      config:
        maxIterations: 10
        maxCompileRetries: 3
        negativeStreakLimit: 3
        convergenceThreshold: 0.05
    - id: canness-remote
      name: dsh-canness/remote-api
      config:
        tokenRef: CANNLAB_GITCODE_TOKEN
        cacheRoot: ""
        keyDir: ""
        logPath: ""
        instance: ""
