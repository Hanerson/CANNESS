name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: plugin (node 24, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plugin/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Knowledge base
        run: pnpm kb:validate

      - name: Remote script syntax
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" -m py_compile remote/runner.py remote/validate_submission.py
          bash -n templates/cannbench/build.sh

      - name: Build
        run: pnpm build

      - name: Built lib matches sources
        shell: bash
        run: |
          # dsh loads lib/, so a stale build is a user-visible bug: exports and
          # evaluations now refuse to run on it. Keep CI honest about that.
          node -e '
            import("./lib/package-files.js").then(module => {
              const fingerprint = module.contractFingerprint();
              if (fingerprint.staleBuild) {
                console.error(fingerprint.warnings.join("\n"));
                process.exit(1);
              }
              console.log(`codeSource=${fingerprint.codeSource} lib=${fingerprint.libHash.slice(0, 19)}`);
            }).catch(error => { console.error(error); process.exit(1); });
          '
